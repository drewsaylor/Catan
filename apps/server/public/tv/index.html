<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catan (TV)</title>
    <link rel="stylesheet" href="/shared/styles.css" />
    <link rel="stylesheet" href="/tv/tv.css" />
    <link rel="icon" href="/favicon.png" type="image/png" />
  </head>
  <!-- The TV is a cast display with no input: nothing on this page is interactive. -->
  <body class="tv" data-screen="attract">
    <!-- Attract: no one has joined yet -->
    <section id="attractScreen" class="attractScreen">
      <div class="joinBar">
        <div class="joinBarText">
          <div class="joinBarLead">Grab your phone to play</div>
          <div class="joinBarUrl" id="attractUrl"></div>
        </div>
        <div class="joinBarCode">
          <div class="eyebrow">Room code</div>
          <div class="roomCode" id="attractCode">-----</div>
        </div>
        <div class="qrTile" id="attractQr" aria-hidden="true"></div>
      </div>
    </section>

    <!-- Lobby: players are joining -->
    <section id="lobbyScreen" class="lobbyScreen">
      <div id="lobbyBoardPreview" class="lobbyBoardPreview" aria-hidden="true"></div>
      <div class="lobbyJoin">
        <div class="eyebrow">Room code</div>
        <div class="roomCode" id="lobbyCode">-----</div>
        <div class="qrTile" id="lobbyQr" aria-hidden="true"></div>
        <ol class="joinSteps">
          <li>Scan the code, or open <b id="lobbyUrl"></b></li>
          <li>Enter your name</li>
          <li>Tap <b>Ready</b></li>
        </ol>
      </div>
      <div class="lobbyRoster">
        <div class="lobbyRosterHead">
          <h1 id="lobbyScenarioTitle">Classic</h1>
          <div class="lobbyPills" id="lobbyPills"></div>
        </div>
        <div class="lobbySlots" id="lobbySlots"></div>
        <div class="lobbyStatus" id="lobbyStatus" role="status"></div>
      </div>
    </section>

    <!-- Game and end screen: the board fills everything the rails don't need -->
    <main id="stage" class="stage">
      <aside class="rail railLeft">
        <section class="turnCard" id="turnCard">
          <div class="turnTop">
            <span class="eyebrow" id="turnKicker"></span>
            <span class="turnTimer" id="turnTimer"></span>
          </div>
          <div class="turnName" id="turnName"></div>
          <div class="turnAction" id="turnAction"></div>
          <div class="turnWaiting" id="turnWaiting"></div>
        </section>
        <section class="diceHud" id="diceHud"></section>
        <section class="railPanel eventPanel" id="eventPanel" hidden>
          <div class="eyebrow">Event</div>
          <div class="panelTitle" id="eventTitle"></div>
          <div class="panelBody" id="eventDescription"></div>
        </section>
        <section class="railPanel offersPanel" id="offersPanel" hidden>
          <div class="eyebrow">Open trades</div>
          <div id="offers"></div>
        </section>
        <div class="toastRail" id="toastRail" aria-hidden="true"></div>
        <section class="ticker" id="ticker"></section>
        <div class="rejoinPill" id="rejoinPill"></div>
      </aside>

      <div class="boardStage" id="boardStage">
        <div id="board"></div>
      </div>

      <aside class="rail railRight">
        <div class="vpGoal" id="vpGoal"></div>
        <div class="playerCards" id="playerCards"></div>
      </aside>

      <section class="endPanel" id="endPanel"></section>
    </main>

    <div id="connectionOverlay" class="connectionOverlay" style="display: none" aria-live="polite">
      <div class="connectionOverlayCard">
        <div id="connectionTitle" class="connectionOverlayTitle">Reconnecting…</div>
        <div id="connectionHint" class="connectionOverlayHint"></div>
      </div>
    </div>

    <div id="showLayer" class="showLayer" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/tv/tv.js"></script>
  </body>
</html>
